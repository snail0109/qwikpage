name: Build Code-Vue Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'code-vue/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'code-vue/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
            artifact_path: code-vue/target/x86_64-apple-darwin/release/libcode_vue.dylib
            artifact_name: libcode_vue_intel.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-apple-silicon
            artifact_path: code-vue/target/aarch64-apple-darwin/release/libcode_vue.dylib
            artifact_name: libcode_vue_arm64.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
            artifact_path: code-vue/target/release/code_vue.dll
            artifact_name: code_vue.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build for macOS (Intel & Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: |
          cd code-vue
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd code-vue
          cargo build --release
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: code-vue-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release
          cp artifacts/code-vue-macos-intel/libcode_vue.dylib release/libcode_vue_intel.dylib
          cp artifacts/code-vue-macos-apple-silicon/libcode_vue.dylib release/libcode_vue_arm64.dylib
          cp artifacts/code-vue-windows/code_vue.dll release/code_vue.dll

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Code-Vue Plugin Release ${{ github.sha }}
          tag_name: code-vue-${{ github.sha }}
          files: |
            release/libcode_vue_intel.dylib
            release/libcode_vue_arm64.dylib
            release/code_vue.dll
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
