name: "release"

on:
  release:
    types: [published]
  schedule:
    - cron: '20 7 * * *' # 北京时间 15:20
    - cron: '0 9 * * *' # UTC 9:00 (北京时间 17:00)

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.
 
      - name: install frontend dependencies
        run: pnpm install --no-frozen-lockfile # change this to npm, pnpm or bun depending on which one you use.

      - name: Process version for scheduled builds
        if: github.event_name == 'schedule'
        id: version
        run: |
          # 提取基础版本号,添加时间戳
          BASE_VERSION=$(grep -o '"version": "[^"]*"' backend/tauri.conf.json | cut -d'"' -f4 | sed -E 's/-alpha\.[0-9]+//')
          timestamp=$(date +%Y%m%d%H%M%S)
          FINAL_VERSION="${BASE_VERSION}-alpha.${timestamp}"
          echo "VERSION=${FINAL_VERSION}" >> $GITHUB_ENV
          echo "Generated version: ${FINAL_VERSION}"
          
          # 更新 tauri.conf.json 中的版本号
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "(Get-Content backend/tauri.conf.json) -replace '\"version\": \"[^\"]*\"', '\"version\": \"$env:FINAL_VERSION\"' | Set-Content backend/tauri.conf.json"
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${FINAL_VERSION}\"/" backend/tauri.conf.json
          fi

      - name: Generate release name
        id: release_name
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "RELEASE_NAME=QwikPage v${{ env.VERSION }}" >> $GITHUB_ENV
            echo "TAG_NAME=app-v${{ env.VERSION }}" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=QwikPage v__VERSION__" >> $GITHUB_ENV
            echo "TAG_NAME=app-v__VERSION__" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
          fi
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG_NAME }} # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: ${{ env.PRERELEASE }}
          args: ${{ matrix.args }}
